name: Deploy Langfuse to GCP VM (Optimized - Hosted Services)

on:
  push:
    branches:
      - release/voyager-main
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        type: choice
        options:
          - staging
          - production
        required: true
        default: staging

jobs:
  deploy-to-gcp:
    name: Deploy Langfuse to GCP VM
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.GCP_WIF_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Prepare Deployment Files
        run: |
          # Copy the voyager compose file
          cp docker-compose.voyager.yml docker-compose.prod.yml
          
          # Create environment file locally
          cat <<EOF > .env
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          SALT=${{ secrets.SALT }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          REDIS_HOST=${{ secrets.REDIS_HOST }}
          REDIS_PORT=${{ secrets.REDIS_PORT }}
          REDIS_AUTH=${{ secrets.REDIS_AUTH }}
          REDIS_TLS_ENABLED=true
          MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}
          LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${{ secrets.LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY }}
          LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=${{ secrets.LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY }}
          LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY=${{ secrets.LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY }}
          EOF

      - name: Copy files to VM via IAP
        run: |
          # Ensure directory exists on VM
          gcloud compute ssh langfuse-prod --zone="asia-south2-a" --tunnel-through-iap --quiet --command="mkdir -p ~/langfuse"
          
          # Copy files
          gcloud compute scp --quiet --tunnel-through-iap --zone="asia-south2-a" \
            docker-compose.prod.yml .env langfuse-prod:~/langfuse/

      - name: SSH into GCP VM and Deploy
        run: |
          gcloud compute ssh langfuse-prod \
            --quiet \
            --zone="asia-south2-a" \
            --tunnel-through-iap \
            --command="
              cd ~/langfuse

              # 1. Grant docker permissions
              if ! groups | grep -q 'docker'; then
                sudo usermod -aG docker \$USER
              fi

              # 2. Pull latest images
              sudo docker compose -f docker-compose.prod.yml pull

              # 3. Stop and remove existing containers
              sudo docker compose -f docker-compose.prod.yml down

              # 4. Start services
              sudo docker compose -f docker-compose.prod.yml up -d

              # 5. Clean up old images
              sudo docker system prune -f

              # 6. Wait for services to be ready
              echo 'Waiting for services to be ready...'
              sleep 60

              # 7. Health check with retry
              for i in {1..5}; do
                echo \"Health check attempt \$i/5...\"
                if curl -f http://localhost:3000/api/public/health && curl -f http://localhost:3030/api/health; then
                  echo \"Health checks passed!\"
                  break
                fi
                if [ \$i -eq 5 ]; then
                  echo \"Health checks failed after 5 attempts\"
                  exit 1
                fi
                sleep 30
              done

              echo \"Langfuse deployment completed successfully!\"
            "
